name: Run script on merge to dev by gitlocalize-app

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Pushes the generated locales back to main, so it needs contents: write - and only that.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14
      - name: Run script if manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/sync_translations.py
      - name: Run script if merged by gitlocalize-app[bot]
        if: github.event_name == 'push' && github.event.head_commit.author.username == 'gitlocalize-app[bot]'
        run: |
          python scripts/sync_translations.py
      - name: Commit to main
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: Update translations
          branch: main

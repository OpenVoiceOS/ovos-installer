name: Testing shell components with BATS

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - .github/workflows/shell_testing.yml
      - .github/scripts/**
      - setup.sh
      - scripts/**
      - translations/**
      - utils/**
      - tui/**
      - tests/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/shell_testing.yml
      - .github/scripts/**
      - setup.sh
      - scripts/**
      - translations/**
      - utils/**
      - tui/**
      - tests/**
  workflow_dispatch:

jobs:
  shell-testing:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install BATS requirements
        run: |
          ./.github/scripts/apt_update.sh
          # whiptail so the TUI can be walked through the real binary, not just
          # the stub the rest of the suite uses.
          sudo apt-get --no-install-recommends install -y bats git ca-certificates whiptail

      - name: Install BATS helper libraries
        run: ./.github/scripts/install_bats_helpers.sh

      - name: Run bats
        run: bats tests/bats --verbose-run --print-output-on-failure

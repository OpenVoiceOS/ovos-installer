---
name: Refresh telemetry charts

# The README charts are rendered from the public telemetry summary, because
# GitHub does not run the dashboard's JavaScript in a README. Committing them
# on a schedule keeps them current without the README depending on a third
# party being up when someone reads it.

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # Daily. The numbers move slowly; anything more often is churn.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Render charts from the telemetry summary
        run: python3 scripts/render_telemetry_charts.py

      - name: Commit when the numbers moved
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: "chore(docs): refresh telemetry charts"
          file_pattern: docs/images/telemetry-*.svg

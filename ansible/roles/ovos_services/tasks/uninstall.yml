---
- name: Build uninstall unit list
  ansible.builtin.set_fact:
    ovos_services_uninstall_units: "{{ (ovos_services_managed_units + [ovos_services_admin_unit]) | unique }}"

- name: Ensure systemd user runtime is available
  ansible.builtin.import_tasks: systemd-user-runtime.yml
  vars:
    ovos_services_manage_linger: false

- name: Stop and disable OVOS system units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    scope: system
  loop: "{{ ovos_services_uninstall_units }}"
  failed_when: false

- name: Stop and disable OVOS user units
  become: true
  become_user: "{{ ovos_installer_user }}"
  environment: "{{ ovos_services_user_bus_environment }}"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    scope: user
  loop: "{{ ovos_services_uninstall_units }}"
  failed_when: false

- name: Remove OVOS systemd unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  notify:
    - Reload Udev
    - Reload Systemd
    - Reload Systemd User
  loop: "{{ ovos_services_unit_files_system + ovos_services_unit_files_user }}"

- name: Remove OVOS system drop-in directories
  ansible.builtin.file:
    path: "{{ ovos_installer_systemd_system_path }}/{{ item }}.d"
    state: absent
  loop: "{{ ovos_services_uninstall_units }}"
  notify: Reload Systemd

- name: Remove OVOS user drop-in directories
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.file:
    path: "{{ ovos_installer_systemd_user_path }}/{{ item }}.d"
    state: absent
  loop: "{{ ovos_services_uninstall_units }}"
  notify: Reload Systemd User

- name: Remove OVOS system wants directories
  ansible.builtin.file:
    path: "{{ ovos_installer_systemd_system_path }}/{{ item }}.wants"
    state: absent
  loop: "{{ ovos_services_uninstall_units }}"
  notify: Reload Systemd

- name: Remove OVOS user wants directories
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.file:
    path: "{{ ovos_installer_systemd_user_path }}/{{ item }}.wants"
    state: absent
  loop: "{{ ovos_services_uninstall_units }}"
  notify: Reload Systemd User

- name: Find system OVOS unit backup files
  ansible.builtin.find:
    paths: "{{ ovos_installer_systemd_system_path }}"
    patterns: "{{ ovos_services_unit_backup_patterns }}"
    file_type: file
  register: ovos_services_system_backup_units
  changed_when: false

- name: Remove system OVOS unit backup files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ovos_services_system_backup_units.files }}"
  when: ovos_services_system_backup_units.matched | int > 0
  notify: Reload Systemd

- name: Find user OVOS unit backup files
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.find:
    paths: "{{ ovos_installer_systemd_user_path }}"
    patterns: "{{ ovos_services_unit_backup_patterns }}"
    file_type: file
  register: ovos_services_user_backup_units
  changed_when: false

- name: Remove user OVOS unit backup files
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ovos_services_user_backup_units.files }}"
  when: ovos_services_user_backup_units.matched | int > 0
  notify: Reload Systemd User

- name: Reset failed OVOS systemd units (system scope)  # noqa command-instead-of-module
  ansible.builtin.command: systemctl reset-failed
  changed_when: false
  failed_when: false

- name: Reset failed OVOS systemd units (user scope)  # noqa command-instead-of-module
  become: true
  become_user: "{{ ovos_installer_user }}"
  environment: "{{ ovos_services_user_bus_environment }}"
  ansible.builtin.command: systemctl --user reset-failed
  changed_when: false
  failed_when: false

# Lingering keeps the user's systemd instance (and with it PipeWire and
# WirePlumber) running with no login session. Left enabled after an uninstall it
# is not inert: a sound server started outside the session takes the devices the
# session then cannot, which is reported as audio that died and as phantom
# devices that will not go away. Only switch it off where the marker says this
# installer is what switched it on - a machine that already had it keeps it.
- name: Check for the lingering ownership marker
  ansible.builtin.stat:
    path: "{{ ovos_services_linger_marker_path }}"
  register: ovos_services_linger_marker
  changed_when: false

- name: Disable lingering this installer enabled  # noqa command-instead-of-module
  ansible.builtin.command: "{{ ovos_services_disable_linger_cmd }}"
  register: ovos_services_disable_linger
  changed_when: ovos_services_disable_linger.rc == 0
  failed_when: false
  when:
    - ansible_facts.system == 'Linux'
    - ovos_services_linger_marker.stat.exists | default(false)

# Confirm against the file rather than the exit status: this is the thing the next
# uninstall would have to retry.
- name: Check whether lingering is now off
  ansible.builtin.stat:
    path: "{{ ovos_services_linger_path }}"
  register: ovos_services_linger_after
  changed_when: false
  when: ovos_services_linger_marker.stat.exists | default(false)

# Only once lingering is really off. A marker dropped after a failed disable would
# take the next uninstall's authority to retry with it, leaving lingering on for
# good - the exact state this change exists to prevent.
- name: Remove the lingering ownership marker
  ansible.builtin.file:
    path: "{{ ovos_services_linger_marker_path }}"
    state: absent
  when:
    - ovos_services_linger_marker.stat.exists | default(false)
    - not (ovos_services_linger_after.stat.exists | default(true))

- name: Report lingering that could not be switched off
  ansible.builtin.debug:
    msg: >-
      Lingering is still enabled for {{ ovos_installer_user }} and this installer
      enabled it. Run "{{ ovos_services_disable_linger_cmd }}" by hand; the
      ownership marker at {{ ovos_services_linger_marker_path }} is kept so a later
      uninstall retries it.
  when:
    - ovos_services_linger_marker.stat.exists | default(false)
    - ovos_services_linger_after.stat.exists | default(false)

- name: Flush handlers ovos (uninstall)
  ansible.builtin.meta: flush_handlers

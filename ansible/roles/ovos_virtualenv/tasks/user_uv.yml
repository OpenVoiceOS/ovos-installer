---
# The installer's uv goes in ~/.local/bin for OVOS to use after the install, unless the
# user already had one there. Copied over it, a uv of theirs was replaced, and the
# uninstall, which removes only what the first install found absent, left the
# installer's in its place. The footprint record says which it was; an install from
# before the record keeps the copy it always got. A record that is there but cannot be
# read says nothing, and then the uv in ~/.local/bin stays as it is.
- name: Check installer uv binary
  ansible.builtin.stat:
    path: "{{ ovos_virtualenv_installer_venv_path }}/bin/uv"
  register: ovos_virtualenv_uv_bin
  changed_when: false

- name: Check for the footprint record
  ansible.builtin.stat:
    path: "{{ ovos_installer_footprint_marker_path }}"
  register: ovos_virtualenv_footprint_stat

- name: Read whether the first install found a uv in ~/.local/bin
  ansible.builtin.slurp:
    src: "{{ ovos_installer_footprint_marker_path }}"
  register: ovos_virtualenv_footprint_raw
  failed_when: false
  when: ovos_virtualenv_footprint_stat.stat.exists

- name: Decide whether ~/.local/bin/uv is the installer's
  vars:
    _record: >-
      {{ (ovos_virtualenv_footprint_raw.content | b64decode | from_json)
         if (ovos_virtualenv_footprint_raw.content is defined) else {} }}
  ansible.builtin.set_fact:
    ovos_virtualenv_user_uv_is_ours: >-
      {{ not ovos_virtualenv_footprint_stat.stat.exists
         or ((ovos_installer_user_home ~ '/.local/bin/uv') in (_record.absent | default([]))) }}

- name: Ensure user local bin exists
  ansible.builtin.file:
    path: "{{ ovos_installer_user_home }}/.local/bin"
    state: directory
    owner: "{{ ovos_installer_user }}"
    group: "{{ ovos_installer_group }}"
    mode: '0755'
  when: ovos_virtualenv_user_uv_is_ours | bool

- name: Install uv for user from installer venv
  ansible.builtin.copy:
    src: "{{ ovos_virtualenv_installer_venv_path }}/bin/uv"
    dest: "{{ ovos_installer_user_home }}/.local/bin/uv"
    owner: "{{ ovos_installer_user }}"
    group: "{{ ovos_installer_group }}"
    mode: '0755'
    remote_src: true
  when:
    - ovos_virtualenv_uv_bin.stat.exists | default(false)
    - ovos_virtualenv_user_uv_is_ours | bool

- name: Say why the user's own uv stays
  ansible.builtin.debug:
    msg: >-
      {{ ovos_installer_user_home }}/.local/bin/uv was there before Open Voice OS, so it is
      left as it is. The installer uses its own.
  when:
    - not (ovos_virtualenv_user_uv_is_ours | bool)
    - ovos_virtualenv_footprint_raw.content is defined

- name: Say why ~/.local/bin/uv is left alone
  ansible.builtin.debug:
    msg: >-
      {{ ovos_installer_footprint_marker_path }} could not be read, so nothing says whether
      {{ ovos_installer_user_home }}/.local/bin/uv is the user's, and it is left as it is.
      The installer uses its own.
  when:
    - not (ovos_virtualenv_user_uv_is_ours | bool)
    - ovos_virtualenv_footprint_raw.content is not defined

- name: Warn if installer uv binary missing
  ansible.builtin.debug:
    msg: "uv binary not found in installer venv; skipping user install."
  when: not (ovos_virtualenv_uv_bin.stat.exists | default(false))

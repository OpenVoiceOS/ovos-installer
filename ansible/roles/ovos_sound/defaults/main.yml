---
ovos_sound_is_cleaning: "{{ ovos_installer_is_cleaning | default(ovos_installer_cleaning | default(false) | bool) | bool }}"
ovos_sound_pipewire_alsa_package: pipewire-alsa
ovos_sound_pipewire_fallback_package: pipewire
ovos_sound_alsa_utils_package: alsa-utils
ovos_sound_pulseaudio_package: pulseaudio
ovos_sound_audio_group: audio
ovos_sound_rtkit_group: rtkit
ovos_sound_pipewire_group: pipewire
ovos_sound_linger_path: "{{ ovos_installer_linger_path }}"
ovos_sound_pgrep_cmd: pgrep
ovos_sound_pipewire_pulse_process: pipewire-pulse
ovos_sound_pulseaudio_process: pulseaudio
ovos_sound_pipewire_process: pipewire
ovos_sound_asoundrc_path: "{{ ovos_installer_user_home }}/.asoundrc"
ovos_sound_asoundrc_mode: "0644"
ovos_sound_expected_server: "{{ (ovos_installer_sound_server | default('N/A')) | lower }}"
ovos_sound_supported_alsa_defaults:
  - pipewire
  - pulseaudio
ovos_sound_mark2_default_server: pipewire
# What the install added, so the uninstall can take back exactly that: the sound
# packages that were not there before, and the groups the user was not in.
ovos_sound_package_marker_path: "{{ ovos_installer_package_tracking_dir }}/sound.json"
ovos_sound_groups_marker_path: "{{ ovos_installer_package_tracking_dir }}/sound-groups.json"
# Group membership as getent last read it (templates/sound_groups_member.j2).
ovos_sound_getent_group: "{{ ansible_facts.getent_group | default({}) }}"

---
- name: Choose the sound stack for this distribution
  vars:
    # Debian Unstable hack
    _distribution_version: "{{ '99' if ansible_facts.distribution == 'Debian' and ansible_facts.distribution_version == 'n/a' else ansible_facts.distribution_version }}"
  ansible.builtin.set_fact:
    ovos_sound_use_pulseaudio: >-
      {{
        (ansible_facts.distribution == 'Ubuntu' and _distribution_version is version(ovos_sound_pipewire_min_ubuntu_version, '<='))
        or (ansible_facts.distribution == 'Debian' and _distribution_version is version(ovos_sound_pipewire_min_debian_version, '<='))
      }}
    ovos_sound_pipewire_package: >-
      {{ (ansible_facts.distribution not in ovos_sound_pipewire_distributions_skip_alsa)
         | ternary(ovos_sound_pipewire_alsa_package, ovos_sound_pipewire_fallback_package) }}

# Tracked like the other roles' packages: the uninstall removes what was not there
# before, and leaves a sound stack the machine already had.
- name: Prepare tracked sound package ownership
  ansible.builtin.include_role:
    name: ovos_installer
    tasks_from: package_tracking_prepare_linux.yml
  vars:
    ovos_installer_package_tracking_marker_path: "{{ ovos_sound_package_marker_path }}"
    ovos_installer_package_tracking_requested_packages:
      - "{{ ovos_sound_pulseaudio_package if ovos_sound_use_pulseaudio | bool else ovos_sound_pipewire_package }}"
      - "{{ ovos_sound_alsa_utils_package }}"

- name: Install PipeWire with ALSA support
  ansible.builtin.package:
    name:
      - "{{ ovos_sound_pipewire_package }}"
      - "{{ ovos_sound_alsa_utils_package }}"
  register: ovos_sound_pipewire_install
  when: not (ovos_sound_use_pulseaudio | bool)

- name: Install PulseAudio on older Debian and Ubuntu versions
  ansible.builtin.apt:
    name:
      - "{{ ovos_sound_pulseaudio_package }}"
      - "{{ ovos_sound_alsa_utils_package }}"
  register: ovos_sound_pulseaudio_install
  when: ovos_sound_use_pulseaudio | bool

- name: Persist tracked sound package ownership
  ansible.builtin.include_role:
    name: ovos_installer
    tasks_from: package_tracking_persist.yml
  vars:
    ovos_installer_package_tracking_marker_path: "{{ ovos_sound_package_marker_path }}"

- name: Determine available groups
  ansible.builtin.getent:
    database: group

- name: Note which sound groups the user is already in
  ansible.builtin.set_fact:
    ovos_sound_groups_before: "{{ lookup('ansible.builtin.template', 'sound_groups_member.j2') | trim | from_json }}"

- name: Resolve service manager for sound role
  ansible.builtin.set_fact:
    ovos_sound_service_manager: "{{ ovos_services_manager | default('launchd' if ansible_facts.system == 'Darwin' else (ansible_facts.service_mgr | default('systemd'))) }}"
  changed_when: false

- name: Add installer user to audio group
  ansible.builtin.user:
    name: "{{ ovos_installer_user }}"
    groups:
      - "{{ ovos_sound_audio_group }}"
    append: true
  when: ovos_sound_audio_group in ansible_facts.getent_group

- name: Add installer user to rtkit group
  ansible.builtin.user:
    name: "{{ ovos_installer_user }}"
    groups:
      - "{{ ovos_sound_rtkit_group }}"
    append: true
  when: ovos_sound_rtkit_group in ansible_facts.getent_group

- name: Add installer user to pipewire group
  ansible.builtin.user:
    name: "{{ ovos_installer_user }}"
    groups: "{{ ovos_sound_pipewire_group }}"
    append: true
  when:
    - not (ovos_sound_use_pulseaudio | bool)
    - ansible_facts.os_family not in ovos_sound_pipewire_group_excluded_os_families
    - ansible_facts.distribution not in ovos_sound_pipewire_group_excluded_distributions
    - ovos_sound_pipewire_group in ansible_facts.getent_group


# Membership before and after: the groups this run added are the ones the uninstall
# takes the user out of, merged with what earlier runs added.
- name: Read the groups again after adding the user to them
  ansible.builtin.getent:
    database: group

- name: Note which sound groups the user is in now
  ansible.builtin.set_fact:
    ovos_sound_groups_after: "{{ lookup('ansible.builtin.template', 'sound_groups_member.j2') | trim | from_json }}"

- name: Check for groups an earlier run added
  ansible.builtin.stat:
    path: "{{ ovos_sound_groups_marker_path }}"
  register: ovos_sound_groups_marker_stat

- name: Read the groups an earlier run added
  ansible.builtin.slurp:
    src: "{{ ovos_sound_groups_marker_path }}"
  register: ovos_sound_groups_marker_raw
  when: ovos_sound_groups_marker_stat.stat.exists | default(false) | bool

- name: Record the groups this install added the user to
  vars:
    _earlier: >-
      {{ (ovos_sound_groups_marker_raw.content | b64decode | from_json)
         if ovos_sound_groups_marker_raw.content is defined else [] }}
    _added: "{{ ovos_sound_groups_after | difference(ovos_sound_groups_before) }}"
  ansible.builtin.copy:
    dest: "{{ ovos_sound_groups_marker_path }}"
    content: "{{ (_earlier + _added) | unique | sort | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  when: (_earlier + _added) | length > 0
- name: Record whether this install is what enables lingering
  ansible.builtin.include_role:
    name: ovos_installer
    tasks_from: linger_claim.yml
  when: ovos_sound_service_manager == 'systemd'

- name: Enable lingering for {{ ovos_installer_user }}
  ansible.builtin.file:
    path: "{{ ovos_sound_linger_path }}"
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
    state: touch
  notify: Start Sound Server
  when: ovos_sound_service_manager == 'systemd'

- name: Persist lingering ownership once it is actually enabled
  ansible.builtin.include_role:
    name: ovos_installer
    tasks_from: linger_confirm.yml
  when: ovos_sound_service_manager == 'systemd'

- name: Flush handlers sound
  ansible.builtin.meta: flush_handlers

- name: Ensure PipeWire user sound services are running before detection
  when:
    - ovos_sound_service_manager == 'systemd'
    - ovos_sound_pipewire_install is defined
    - "'skipped' not in ovos_sound_pipewire_install.keys()"
  block:
    - name: Ensure PipeWire user service is started
      become: true
      become_user: "{{ ovos_installer_user }}"
      ansible.builtin.systemd_service:
        name: pipewire
        scope: user
        state: started

    - name: Ensure PipeWire PulseAudio compatibility user service is started
      become: true
      become_user: "{{ ovos_installer_user }}"
      ansible.builtin.systemd_service:
        name: pipewire-pulse
        scope: user
        state: started
      when: ovos_sound_expected_server == 'pulseaudio'

- name: Ensure PulseAudio user sound service is running before detection
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.systemd_service:
    name: pulseaudio
    scope: user
    state: started
  when:
    - ovos_sound_service_manager == 'systemd'
    - ovos_sound_pulseaudio_install is defined
    - "'skipped' not in ovos_sound_pulseaudio_install.keys()"

- name: Check for pipewire-pulse
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command: "{{ ovos_sound_pgrep_cmd }} -x {{ ovos_sound_pipewire_pulse_process }}"
  register: ovos_sound_pipewire_pulse_pgrep
  changed_when: false
  failed_when: false

- name: Check for pulseaudio
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command: "{{ ovos_sound_pgrep_cmd }} -x {{ ovos_sound_pulseaudio_process }}"
  register: ovos_sound_pulseaudio_pgrep
  changed_when: false
  failed_when: false

- name: Check for pipewire
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command: "{{ ovos_sound_pgrep_cmd }} -x {{ ovos_sound_pipewire_process }}"
  register: ovos_sound_pipewire_pgrep
  changed_when: false
  failed_when: false

- name: Re-detect sound server
  ansible.builtin.set_fact:
    ovos_sound_detect_sound_server: >-
      {{ {'stdout': (
        'pipewire' if ovos_sound_pipewire_pulse_pgrep.rc == 0 else
        'pulseaudio' if ovos_sound_pulseaudio_pgrep.rc == 0 else
        'pipewire' if ovos_sound_pipewire_pgrep.rc == 0 else
        (ovos_sound_wsl_default_server if ((ansible_facts.kernel | default('') | lower) is search('microsoft')) else ovos_sound_detect_default_server)
      ) } }}
  changed_when: false

- name: Resolve ALSA default backend for .asoundrc
  vars:
    _ovos_sound_detected_server: "{{ ovos_sound_detect_sound_server.stdout | default('') | lower }}"
    _ovos_sound_expected_server: "{{ ovos_sound_expected_server | default('') | lower }}"
    _ovos_sound_mark2_fallback_server: "{{ ovos_sound_mark2_default_server | default('pipewire') | lower }}"
  ansible.builtin.set_fact:
    ovos_sound_asoundrc_server: >-
      {{
        _ovos_sound_detected_server
        if (_ovos_sound_detected_server in ovos_sound_supported_alsa_defaults)
        else _ovos_sound_expected_server
        if (_ovos_sound_expected_server in ovos_sound_supported_alsa_defaults)
        else _ovos_sound_mark2_fallback_server
        if (
          ((ovos_installer_raspberrypi | default('')) | regex_search(ovos_installer_raspberry_pi_4_regex)) and
          ('tas5806' in (ovos_installer_i2c_devices | default([]))) and
          (_ovos_sound_mark2_fallback_server in ovos_sound_supported_alsa_defaults)
        )
        else ''
      }}
  changed_when: false

- name: Generate .asoundrc based on detected sound server (Raspberry Pi only)
  ansible.builtin.copy:
    content: |
      pcm.!default {{ ovos_sound_asoundrc_server }}
      ctl.!default {{ ovos_sound_asoundrc_server }}
    dest: "{{ ovos_sound_asoundrc_path }}"
    owner: "{{ ovos_installer_user }}"
    group: "{{ ovos_installer_group }}"
    mode: "{{ ovos_sound_asoundrc_mode }}"
    backup: true
  when:
    - ovos_installer_raspberrypi | default('N/A') != "N/A"
    - ovos_sound_asoundrc_server | length > 0

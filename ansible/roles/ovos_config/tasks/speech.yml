---
# Local speech: STT and TTS run on this host. speech_setup.py picks the plugins and
# models - ovos-config's recommendation for the locale, or the plugin's own choice
# for the language when that does not work here - downloads them, and proves they
# run before anything is written: a voice the installed phoonnx cannot speak, or a
# model too big for the machine, would otherwise leave a device mute or deaf. Only
# the stt and tts sections are taken: `ovos-config autoconfigure` also merges
# per-language defaults for units, wake words and intents, which this installer
# sets itself.
#
# The caller says where OVOS runs: ovos_config_speech_python, the virtualenv's
# Python, or ovos_config_speech_containers, the names of the listener and audio
# containers.
- name: Pick, download and check the local speech plugins
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command:
    argv:
      - "{{ ovos_config_speech_python }}"
      - -c
      - "{{ lookup('ansible.builtin.file', 'speech_setup.py') }}"
      - stt,tts
      - "{{ ovos_installer_locale }}"
      - "{{ 'female' if ovos_installer_ovos_config_tts_gender == '--female' else 'male' }}"
      - "{{ ovos_config_speech_stt_memory_budget_mb }}"
  register: ovos_config_speech_setup
  changed_when: false
  when: ovos_config_speech_containers is not defined

# Each half is set up where it will run - the recognizer in the listener, the
# voice in the audio service - so each model lands in that container's volume
# (ovos_stt_models, ovos_tts_models).
- name: Pick, download and check the local speech plugins in their containers
  become: true
  become_user: "{{ ovos_installer_user }}"
  community.docker.docker_container_exec:
    container: "{{ ovos_config_speech_containers[item.container] }}"
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'speech_setup.py') }}"
      - "{{ item.kind }}"
      - "{{ ovos_installer_locale }}"
      - "{{ 'female' if ovos_installer_ovos_config_tts_gender == '--female' else 'male' }}"
      - "{{ ovos_config_speech_stt_memory_budget_mb }}"
  loop:
    - { kind: stt, container: listener }
    - { kind: tts, container: audio }
  loop_control:
    label: "{{ item.kind }}"
  register: ovos_config_speech_setup_containers
  changed_when: false
  # The listener and audio containers only exist in the desktop profiles.
  when:
    - ovos_config_speech_containers is defined
    - ovos_containers_is_desktop_profile | bool

# A failed local recognition, or one that hears nothing, goes to the public
# server for that utterance instead of leaving the user unanswered.
- name: Keep what works on this machine
  vars:
    _results: >-
      {{
        (ovos_config_speech_setup_containers.results | map(attribute='stdout') | map('from_json') | list)
        if ovos_config_speech_containers is defined
        else [ovos_config_speech_setup.stdout | from_json]
      }}
    _stt: "{{ _results | map(attribute='stt') | select | list | first | default(none) }}"
    _tts: "{{ _results | map(attribute='tts') | select | list | first | default(none) }}"
  ansible.builtin.set_fact:
    ovos_config_speech_wanted: >-
      {{
        ({'stt': _stt | combine({'fallback_module': ovos_config_speech_stt_fallback})}
         if _stt else {})
        | combine({'tts': _tts} if _tts else {})
      }}
    ovos_config_speech_notes: "{{ _results | map(attribute='notes') | flatten }}"

- name: Report what the local speech setup had to work around
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ ovos_config_speech_notes }}"

- name: Report what stays on the public servers
  ansible.builtin.debug:
    msg: >-
      No on-device {{ item | upper }} works for {{ ovos_installer_locale }} on this
      machine, so {{ item | upper }} stays on the public servers.
  loop: "{{ ['stt', 'tts'] | difference(ovos_config_speech_wanted.keys() | list) }}"

- name: Read mycroft.conf for the speech configuration
  ansible.builtin.slurp:
    src: "{{ ovos_config_mycroft_conf_path }}"
  register: ovos_config_speech_conf
  failed_when: false
  changed_when: false
  when: ovos_config_speech_wanted | length > 0

# Same reasoning as homescreen.yml: a hand-edited mycroft.conf that is not
# plain JSON is not a reason to end the install.
- name: Parse mycroft.conf
  when: ovos_config_speech_conf.content is defined
  block:
    - name: Read the current configuration
      ansible.builtin.set_fact:
        ovos_config_speech_conf_current: "{{ ovos_config_speech_conf.content | b64decode | from_json }}"
        ovos_config_speech_conf_readable: true
      changed_when: false
  rescue:
    - name: Note that mycroft.conf could not be read as JSON
      ansible.builtin.set_fact:
        ovos_config_speech_conf_readable: false
      changed_when: false

    - name: Report the speech configuration that has to be set by hand
      ansible.builtin.debug:
        msg: >-
          {{ ovos_config_mycroft_conf_path }} is not plain JSON, so local speech
          was not configured and the public servers stay in use. To switch, add
          these sections to it by hand: {{ ovos_config_speech_wanted | to_json }}

- name: Write the local speech configuration
  vars:
    _conf: "{{ ovos_config_speech_conf_current | default({}, true) }}"
  ansible.builtin.copy:
    content: "{{ _conf | combine(ovos_config_speech_wanted) | to_nice_json }}\n"
    dest: "{{ ovos_config_mycroft_conf_path }}"
    owner: "{{ ovos_config_mycroft_conf_owner }}"
    group: "{{ ovos_config_mycroft_conf_group }}"
    mode: "{{ ovos_config_mycroft_conf_mode }}"
  when:
    - ovos_config_speech_conf_readable | default(false) | bool
    - _conf is mapping
    - (_conf | combine(ovos_config_speech_wanted)) != _conf

- name: Record where speech runs
  vars:
    _applied: "{{ ovos_config_speech_conf_readable | default(false) | bool }}"
  ansible.builtin.set_fact:
    ovos_config_speech_stt_engine: "{{ 'local' if _applied and 'stt' in ovos_config_speech_wanted else 'public' }}"
    ovos_config_speech_tts_engine: "{{ 'local' if _applied and 'tts' in ovos_config_speech_wanted else 'public' }}"

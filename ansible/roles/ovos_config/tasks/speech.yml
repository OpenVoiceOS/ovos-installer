---
# Local speech: STT and TTS run on this host with the plugins and models the
# installed ovos-config recommends for the locale. Those are the files
# `ovos-config autoconfigure --offline` reads, but only their stt and tts
# sections are taken: autoconfigure also merges per-language defaults for units,
# wake words and intents, which this installer sets itself.
#
# The caller passes ovos_config_speech_python, the OVOS virtualenv's Python.
- name: Resolve the speech plugins ovos-config recommends for this locale
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command:
    argv:
      - "{{ ovos_config_speech_python }}"
      - -c
      - "{{ lookup('ansible.builtin.file', 'speech_recommendation.py') }}"
      - "{{ ovos_installer_locale }}"
      - "{{ 'female' if ovos_installer_ovos_config_tts_gender == '--female' else 'male' }}"
  register: ovos_config_speech_probe
  changed_when: false

# A failed local recognition, or one that hears nothing, goes to the public
# server for that utterance instead of leaving the user unanswered.
- name: Keep the recommended sections
  vars:
    _recommended: "{{ ovos_config_speech_probe.stdout | from_json }}"
  ansible.builtin.set_fact:
    ovos_config_speech_wanted: >-
      {{
        ({'stt': _recommended.stt | combine({'fallback_module': ovos_config_speech_stt_fallback})}
         if _recommended.stt else {})
        | combine({'tts': _recommended.tts} if _recommended.tts else {})
      }}

# ovos-config does not recommend on-device speech for every language, and which
# ones it covers changes from one release to the next.
- name: Report what stays on the public servers
  ansible.builtin.debug:
    msg: >-
      The ovos-config release in this virtualenv recommends no on-device
      {{ item | upper }} for {{ ovos_installer_locale }}, so {{ item | upper }}
      stays on the public servers.
  loop: "{{ ['stt', 'tts'] | difference(ovos_config_speech_wanted.keys() | list) }}"

- name: Read mycroft.conf for the speech configuration
  ansible.builtin.slurp:
    src: "{{ ovos_config_mycroft_conf_path }}"
  register: ovos_config_speech_conf
  failed_when: false
  changed_when: false
  when: ovos_config_speech_wanted | length > 0

# Same reasoning as homescreen.yml: a hand-edited mycroft.conf that is not
# plain JSON is not a reason to end the install.
- name: Parse mycroft.conf
  when: ovos_config_speech_conf.content is defined
  block:
    - name: Read the current configuration
      ansible.builtin.set_fact:
        ovos_config_speech_conf_current: "{{ ovos_config_speech_conf.content | b64decode | from_json }}"
        ovos_config_speech_conf_readable: true
      changed_when: false
  rescue:
    - name: Note that mycroft.conf could not be read as JSON
      ansible.builtin.set_fact:
        ovos_config_speech_conf_readable: false
      changed_when: false

    - name: Report the speech configuration that has to be set by hand
      ansible.builtin.debug:
        msg: >-
          {{ ovos_config_mycroft_conf_path }} is not plain JSON, so local speech
          was not configured and the public servers stay in use. To switch, add
          these sections to it by hand: {{ ovos_config_speech_wanted | to_json }}

- name: Write the local speech configuration
  vars:
    _conf: "{{ ovos_config_speech_conf_current | default({}, true) }}"
  ansible.builtin.copy:
    content: "{{ _conf | combine(ovos_config_speech_wanted) | to_nice_json }}\n"
    dest: "{{ ovos_config_mycroft_conf_path }}"
    owner: "{{ ovos_config_mycroft_conf_owner }}"
    group: "{{ ovos_config_mycroft_conf_group }}"
    mode: "{{ ovos_config_mycroft_conf_mode }}"
  when:
    - ovos_config_speech_conf_readable | default(false) | bool
    - _conf is mapping
    - (_conf | combine(ovos_config_speech_wanted)) != _conf

- name: Record where speech runs
  vars:
    _applied: "{{ ovos_config_speech_conf_readable | default(false) | bool }}"
  ansible.builtin.set_fact:
    ovos_config_speech_stt_engine: "{{ 'local' if _applied and 'stt' in ovos_config_speech_wanted else 'public' }}"
    ovos_config_speech_tts_engine: "{{ 'local' if _applied and 'tts' in ovos_config_speech_wanted else 'public' }}"

# Both plugins fetch their model when they are created. Doing that here turns a
# download of up to a few gigabytes into part of the install, instead of a
# listener that sits silent through its first start.
- name: Download the local speech models
  when:
    - ovos_config_speech_conf_readable | default(false) | bool
    - ovos_config_speech_wanted | length > 0
  block:
    - name: Load the local speech plugins once so they fetch their models
      become: true
      become_user: "{{ ovos_installer_user }}"
      ansible.builtin.command:
        argv:
          - "{{ ovos_config_speech_python }}"
          - -c
          - "{{ lookup('ansible.builtin.file', 'speech_prefetch.py') }}"
          # Encoded because Ansible turns a templated string that looks like a
          # dict back into one, and the script would get its Python repr.
          - "{{ ovos_config_speech_wanted | to_json | b64encode }}"
          - "{{ ovos_installer_locale }}"
      register: ovos_config_speech_prefetch
      changed_when: false
      until: ovos_config_speech_prefetch is success
      retries: "{{ ovos_config_speech_prefetch_retries | int }}"
      delay: "{{ ovos_config_speech_prefetch_delay | int }}"
  rescue:
    - name: Report the models that could not be downloaded
      ansible.builtin.debug:
        msg: >-
          The local speech models could not be downloaded
          ({{ (ovos_config_speech_prefetch.stderr_lines | default(['unknown error'], true)) | last }}).
          The speech services download them when they start instead.

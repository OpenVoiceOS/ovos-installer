---
# The shared "Restart PipeWire" / "Restart WirePlumber" handlers belong to
# ovos_services, and they cannot run during an uninstall. That role is imported with
# "when: not ovos_installer_is_cleaning", which a static import applies to its
# handlers as well, and they additionally test facts only the install path sets
# (ovos_sound_detect_sound_server). So the cleanup would remove the filter-chain
# files and the sound server would never be told, leaving the devices in place until
# the user reboots or logs out - which is the complaint this fixes.
#
# These are the cleanup's own: own names, no install-time facts, and no dependency on
# another role being loaded. Failures are not fatal, because the point is only to
# make the removed filter-chains disappear without waiting for a reboot.
- name: Restart PipeWire after audio tuning cleanup
  become: true
  become_user: "{{ ovos_installer_user }}"
  environment: "{{ ovos_audio_tuning_user_bus_environment }}"
  ansible.builtin.systemd_service:
    name: pipewire
    scope: user
    state: restarted
  failed_when: false
  when: ansible_facts.system == 'Linux'

- name: Restart WirePlumber after audio tuning cleanup
  become: true
  become_user: "{{ ovos_installer_user }}"
  environment: "{{ ovos_audio_tuning_user_bus_environment }}"
  ansible.builtin.systemd_service:
    name: wireplumber
    scope: user
    state: restarted
  failed_when: false
  when: ansible_facts.system == 'Linux'

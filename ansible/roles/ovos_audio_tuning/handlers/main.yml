---
# The shared "Restart PipeWire" / "Restart WirePlumber" handlers belong to
# ovos_services, and an uninstall loads that role with handlers_from: noop - so
# notifying them from the cleanup aborts the whole run with "handler not found"
# as soon as a file is really removed. They also test facts the install sets and
# a cleaning run never does. These are the cleanup's own: own names, no
# install-time facts, and failures are not fatal because the point is only to make
# the removed filter-chains disappear without waiting for a reboot.
- name: Restart PipeWire after audio tuning cleanup
  become: true
  become_user: "{{ ovos_installer_user }}"
  environment: "{{ ovos_audio_tuning_user_bus_environment }}"
  ansible.builtin.systemd_service:
    name: pipewire
    scope: user
    state: restarted
  failed_when: false
  when: ansible_facts.system == 'Linux'

- name: Restart WirePlumber after audio tuning cleanup
  become: true
  become_user: "{{ ovos_installer_user }}"
  environment: "{{ ovos_audio_tuning_user_bus_environment }}"
  ansible.builtin.systemd_service:
    name: wireplumber
    scope: user
    state: restarted
  failed_when: false
  when: ansible_facts.system == 'Linux'

---
- name: Check tracked package ownership marker
  ansible.builtin.stat:
    path: "{{ ovos_installer_package_tracking_marker_path }}"
  register: ovos_installer_package_tracking_marker_stat
  changed_when: false

- name: Read tracked package ownership marker
  ansible.builtin.slurp:
    path: "{{ ovos_installer_package_tracking_marker_path }}"
  register: ovos_installer_package_tracking_marker_raw
  when: ovos_installer_package_tracking_marker_stat.stat.exists | default(false) | bool
  changed_when: false

- name: Query installed Homebrew formulae for package tracking
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command:
    argv:
      - brew
      - list
      - --formula
  register: ovos_installer_package_tracking_homebrew_list
  changed_when: false
  environment:
    PATH: "{{ ovos_installer_package_tracking_homebrew_path }}:{{ ansible_env.PATH | default('/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin') }}"

# Under Homebrew's own names: pkg-config is pkgconf and icu4c is icu4c@NN, which is
# what `brew list` shows. Compared under the names asked for, a formula the machine
# already had looked new, and its uninstall would have removed it.
- name: Resolve the requested formulae to Homebrew's own names
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command:
    argv: >-
      {{ ['brew', 'info', '--json=v2', '--formula']
         + ((ovos_installer_package_tracking_requested_packages | default([])) | flatten | reject('equalto', '') | unique | list) }}
  register: ovos_installer_package_tracking_homebrew_info
  changed_when: false
  failed_when: false
  when: (ovos_installer_package_tracking_requested_packages | default([]) | flatten | reject('equalto', '') | list) | length > 0
  environment:
    PATH: "{{ ovos_installer_package_tracking_homebrew_path }}:{{ ansible_env.PATH | default('/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin') }}"

- name: Resolve tracked package ownership state
  vars:
    _ovos_installer_package_tracking_existing_packages: >-
      {{
        ((ovos_installer_package_tracking_marker_raw.content | b64decode | from_json)
         if (ovos_installer_package_tracking_marker_stat.stat.exists | default(false) | bool)
         else [])
        | reject('equalto', '')
        | unique
        | sort
      }}
    _ovos_installer_package_tracking_requested_packages: >-
      {{
        ((ovos_installer_package_tracking_homebrew_info.stdout | from_json).formulae | map(attribute='name') | list)
        if (ovos_installer_package_tracking_homebrew_info.rc | default(1)) == 0
        else ((ovos_installer_package_tracking_requested_packages | default([])) | flatten | reject('equalto', '') | list)
      }}
    _ovos_installer_package_tracking_preinstalled_packages: >-
      {{ _ovos_installer_package_tracking_requested_packages | unique | sort | intersect(ovos_installer_package_tracking_homebrew_list.stdout_lines | default([])) | unique | sort }}
    _ovos_installer_package_tracking_new_packages: >-
      {{ _ovos_installer_package_tracking_requested_packages | difference(_ovos_installer_package_tracking_preinstalled_packages) | unique | sort }}
  ansible.builtin.set_fact:
    ovos_installer_package_tracking_existing_packages: "{{ _ovos_installer_package_tracking_existing_packages }}"
    ovos_installer_package_tracking_requested_packages_normalized: "{{ _ovos_installer_package_tracking_requested_packages }}"
    ovos_installer_package_tracking_preinstalled_packages: "{{ _ovos_installer_package_tracking_preinstalled_packages }}"
    ovos_installer_package_tracking_new_packages: "{{ _ovos_installer_package_tracking_new_packages }}"
    ovos_installer_package_tracking_tracked_packages: >-
      {{ (_ovos_installer_package_tracking_existing_packages + _ovos_installer_package_tracking_new_packages) | unique | sort }}
  changed_when: false

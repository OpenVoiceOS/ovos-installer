---
# Read before the directories go: the record lives in ~/.cache/ovos-installer.
- name: Read what the first install found
  ansible.builtin.import_tasks: footprint_read.yml

- name: Remove OVOS service directories after tuning cleanup
  ansible.builtin.include_role:
    name: ovos_services
    tasks_from: remove-directories.yml
    handlers_from: noop
    # The role's tasks only run under --tags uninstall with the tag applied to them,
    # for the same reason as the include of this file.
    apply:
      tags:
        - uninstall

- name: Give back the user's home as the first install found it
  ansible.builtin.import_tasks: footprint_restore.yml

# Only what this uninstall left unneeded. apt's own autoremove also takes packages
# that were unneeded before the install, which were never the installer's: on the
# CI runners that removed two lldb libraries on every uninstall.
- name: List the packages apt now considers unneeded
  ansible.builtin.command:
    argv: [apt-get, --simulate, autoremove]
  register: ovos_installer_apt_orphans_now
  changed_when: false
  failed_when: false
  when:
    - ovos_installer_uninstall_autoremove | default(true) | bool
    - ansible_facts.os_family in ['Debian', 'Zorin OS']

- name: Remove the packages this uninstall left unneeded
  vars:
    _now: >-
      {{ ovos_installer_apt_orphans_now.stdout_lines | default([])
         | select('match', '^Remv ') | map('split', ' ') | map(attribute=1) | list }}
  ansible.builtin.apt:
    name: "{{ _now | difference(ovos_installer_footprint.orphans) }}"
    state: absent
    purge: true
  failed_when: false
  when:
    - ovos_installer_uninstall_autoremove | default(true) | bool
    - ansible_facts.os_family in ['Debian', 'Zorin OS']
    - ovos_installer_footprint.orphans is defined
    - ovos_installer_footprint.orphans is not none
    - (_now | difference(ovos_installer_footprint.orphans)) | length > 0

- name: Say why packages pulled in as dependencies may stay
  vars:
    _lists:
      Debian: apt-get --simulate autoremove
      Zorin OS: apt-get --simulate autoremove
      RedHat: dnf repoquery --unneeded
      Suse: zypper packages --unneeded
      Archlinux: pacman -Qtdq
  ansible.builtin.debug:
    msg: >-
      This install predates the record of what was already installed, so packages it
      pulled in as dependencies were left in place rather than guessed at.
      `{{ _lists[ovos_installer_package_family] }}` lists what nothing needs any more.
  when:
    - ovos_installer_uninstall_autoremove | default(true) | bool
    - ovos_installer_package_family in _lists
    - ovos_installer_footprint.orphans is not defined or ovos_installer_footprint.orphans is none

- name: List the formulae Homebrew now considers unneeded
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command:
    argv: [brew, autoremove, --dry-run]
  environment:
    PATH: "{{ ovos_installer_homebrew_path | default('/opt/homebrew/bin:/usr/local/bin') }}:/usr/bin:/bin:/usr/sbin:/sbin"
  register: ovos_installer_brew_orphans_now
  changed_when: false
  failed_when: false
  when:
    - ovos_installer_uninstall_autoremove | default(true) | bool
    - ansible_facts.system == 'Darwin'
    - ovos_installer_footprint.orphans is defined
    - ovos_installer_footprint.orphans is not none

# HOMEBREW_NO_AUTOREMOVE: brew uninstall otherwise runs a global autoremove of its
# own afterwards, which takes what was unneeded before as well.
- name: Remove the formulae this uninstall left unneeded
  vars:
    _now: >-
      {{ ovos_installer_brew_orphans_now.stdout_lines | default([])
         | reject('match', '^==>') | map('trim') | select | list }}
  become: true
  become_user: "{{ ovos_installer_user }}"
  ansible.builtin.command:
    argv: "{{ ['brew', 'uninstall'] + (_now | difference(ovos_installer_footprint.orphans)) }}"
  environment:
    PATH: "{{ ovos_installer_homebrew_path | default('/opt/homebrew/bin:/usr/local/bin') }}:/usr/bin:/bin:/usr/sbin:/sbin"
    HOMEBREW_NO_AUTOREMOVE: "1"
  changed_when: true
  failed_when: false
  when:
    - ovos_installer_brew_orphans_now.stdout_lines is defined
    - (_now | difference(ovos_installer_footprint.orphans)) | length > 0

- name: Say why the formulae the install added may stay
  ansible.builtin.debug:
    msg: >-
      This install predates the record of what was already installed, so the formulae
      it added are only marked as no longer installed on request, rather than removed
      along with whatever else nothing needs. `brew autoremove --dry-run` lists them.
  when:
    - ovos_installer_uninstall_autoremove | default(true) | bool
    - ansible_facts.system == 'Darwin'
    - ovos_installer_footprint.orphans is not defined or ovos_installer_footprint.orphans is none

# dnf's autoremove, zypper and pacman's alike, also took what was unneeded before the
# install. SUSE's took worse: `zypper packages --orphaned` lists the packages no
# repository provides, such as an RPM installed by hand, which it removed with their
# dependencies. Only what this uninstall left unneeded goes now, by name.
- name: Remove the packages this uninstall left unneeded (dnf, zypper, pacman)
  ansible.builtin.script:
    cmd: "unneeded_packages.sh remove {{ ovos_installer_package_family }}"
  environment:
    OVOS_UNNEEDED_BEFORE: "{{ ovos_installer_footprint.orphans | join('\n') }}"
  register: ovos_installer_scoped_autoremove
  changed_when: "'removing:' in (ovos_installer_scoped_autoremove.stdout | default(''))"
  failed_when: false
  when:
    - ovos_installer_uninstall_autoremove | default(true) | bool
    - ovos_installer_package_family in ['RedHat', 'Suse', 'Archlinux']
    - ovos_installer_footprint.orphans is defined
    - ovos_installer_footprint.orphans is not none

---
# Give back the user's home as the first install found it. A candidate has to be both
# in the record and in the configured lists, so the record cannot point anywhere else,
# and no symbolic link may sit between the user's home and it, so the removal cannot
# be steered out of the home either. The path itself may be a link, uv's Python is
# one, and removing it removes the link alone. That is what lets the removal run as
# root, which it has to: a sudo that keeps HOME leaves root-owned files there that the
# user cannot remove. Whatever still fails is left for the comparison to report, not
# a reason to stop the uninstall.
# A file from the second list counts only when it is a file of its own, not a link,
# and holds nothing but whitespace once the uninstall has taken its own lines out.
# A shared directory the install created goes whole only when nothing is left in it
# but what the install put there and the tool's own bookkeeping; otherwise only the
# install's part of it goes. From one that was there before, only parts named the way
# only OVOS names them: its models in a Hugging Face cache, and what only they link
# to in the cache's store.
# Nothing this uninstall runs on goes either, the interpreter, the links on the way
# to it or a directory holding one: the rest of the uninstall would stop. Those are
# printed apart, to say why they stay.
- name: Keep the candidates no symbolic link leads to
  vars:
    _recorded: "{{ ovos_installer_footprint.absent | default([]) }}"
    _paths: >-
      {{ (ovos_installer_footprint_paths + ovos_installer_footprint_parent_dirs)
         | select('in', _recorded) | list }}
    _files_if_empty: "{{ ovos_installer_footprint_files_if_empty | select('in', _recorded) | list }}"
    _script: |
      import fnmatch, json, os, sys
      home, args = sys.argv[1], sys.argv[2:]
      cut = args.index("--if-empty")
      real_home = os.path.realpath(home)

      def reachable(path):
          rel = os.path.relpath(path, home)
          if rel in (os.curdir, os.pardir) or rel.startswith(os.pardir + os.sep):
              return False
          parent = os.path.normpath(os.path.join(real_home, os.path.dirname(rel)))
          return os.path.lexists(path) and os.path.realpath(os.path.dirname(path)) == parent

      def empty(path):
          if os.path.islink(path) or not os.path.isfile(path) or os.path.getsize(path) > 4096:
              return False
          with open(path, "rb") as handle:
              return not handle.read().strip()

      in_use = [sys.base_prefix, os.path.realpath(sys.base_prefix), os.path.realpath(sys.executable)]
      link = sys.executable
      for _ in range(40):
          in_use.append(os.path.abspath(link))
          if not os.path.islink(link):
              break
          link = os.path.join(os.path.dirname(link), os.readlink(link))

      def runs_this(path):
          return any(used == path or used.startswith(path.rstrip(os.sep) + os.sep) for used in in_use)

      def keep_or_print(path):
          print(path, file=sys.stderr if runs_this(path) else sys.stdout)

      for path in args[:cut]:
          if reachable(path):
              keep_or_print(path)
      for path in args[cut + 1:]:
          if reachable(path) and empty(path):
              keep_or_print(path)

      def matches(rel, patterns):
          return any(fnmatch.fnmatch(rel, p) or fnmatch.fnmatch(rel, p + "/*") for p in patterns)

      recorded = json.loads(os.environ["OVOS_FOOTPRINT_RECORDED"])
      for spec in json.loads(os.environ["OVOS_FOOTPRINT_SHARED"]):
          base, owned, bookkeeping = spec["path"], spec["owned"], spec["bookkeeping"]
          created = base in recorded
          if not created and not spec.get("owned_even_if_there_before"):
              continue
          if not reachable(base) or os.path.islink(base) or not os.path.isdir(base):
              continue
          entries = []
          for root, dirs, files in os.walk(base):
              entries += [os.path.join(root, name) for name in files]
              entries += [os.path.join(root, name) for name in dirs if os.path.islink(os.path.join(root, name))]

          # Who links to each file in the store, the install's own parts or anything else.
          store = os.path.join(base, spec["store"]) if spec.get("store") else None
          linked = {}
          for path in entries if store else []:
              target = os.path.realpath(path)
              if os.path.islink(path) and target.startswith(os.path.realpath(store) + os.sep):
                  content = os.path.join(store, os.path.relpath(target, os.path.realpath(store)))
                  linked.setdefault(content, set()).add(matches(os.path.relpath(path, base), owned))

          def owner(path):
              rel = os.path.relpath(path, base)
              if matches(rel, owned):
                  return "install"
              if store and path.startswith(store + os.sep):
                  # A file's companions in the store, its list of links and its lock,
                  # go with it. What nothing links to is the store's bookkeeping.
                  name = os.path.basename(path)
                  links = linked.get(os.path.join(os.path.dirname(path), name.split(".")[0] or name), set())
                  return "user" if False in links else "install" if links else None
              return None if matches(rel, bookkeeping) else "user"

          owners = {path: owner(path) for path in entries}
          if created and "user" not in owners.values():
              keep_or_print(base)
              continue
          # The store's own directories go once the install's files are all they hold.
          held = {}
          for path in entries:
              parent = os.path.dirname(path)
              while store and parent.startswith(store + os.sep):
                  held.setdefault(parent, set()).add(owners[path])
                  parent = os.path.dirname(parent)
          for root, dirs, files in os.walk(base):
              for name in sorted(dirs + files):
                  path = os.path.join(root, name)
                  if name in dirs and not os.path.islink(path):
                      if not matches(os.path.relpath(path, base), owned) and held.get(path) != {"install"}:
                          continue
                      dirs.remove(name)
                  elif owners.get(path) != "install":
                      continue
                  if reachable(path):
                      keep_or_print(path)
  ansible.builtin.command:
    argv: "{{ [ansible_playbook_python, '-c', _script, ovos_installer_user_home] + _paths + ['--if-empty'] + _files_if_empty }}"
  environment:
    OVOS_FOOTPRINT_SHARED: "{{ ovos_installer_footprint_shared_dirs | to_json }}"
    OVOS_FOOTPRINT_RECORDED: "{{ _recorded | to_json }}"
  register: ovos_installer_footprint_safe
  changed_when: false

- name: Say what stays because this uninstall runs on it
  ansible.builtin.debug:
    msg: >-
      Left in place, because this uninstall runs on it: {{ ovos_installer_footprint_safe.stderr_lines | join(', ') }}.
      Remove it once the uninstall is over.
  when: (ovos_installer_footprint_safe.stderr_lines | default([])) | length > 0

- name: Remove what the install created in the user's home
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ ovos_installer_footprint_safe.stdout_lines | default([])
       | reject('in', ovos_installer_footprint_parent_dirs) | list }}
  register: ovos_installer_footprint_removed
  failed_when: false

# A removal that fails is not a reason to stop the uninstall, but it is not a quiet
# "ok" either.
- name: Say what could not be removed from the user's home
  ansible.builtin.debug:
    msg: "{{ item.item }} stays: {{ item.msg }}"
  loop: "{{ ovos_installer_footprint_removed.results | default([]) | selectattr('msg', 'defined') | list }}"
  loop_control:
    label: "{{ item.item }}"

# rmdir refuses a directory that is not empty, which is the point: only what the
# install created and nothing else uses goes. Deepest first, as listed.
- name: Remove the directories the install created, where nothing is left in them
  ansible.builtin.command:
    argv: [rmdir, "{{ item }}"]
  loop: >-
    {{ ovos_installer_footprint_parent_dirs
       | select('in', ovos_installer_footprint_safe.stdout_lines | default([])) | list }}
  register: ovos_installer_footprint_rmdir
  changed_when: ovos_installer_footprint_rmdir.rc == 0
  failed_when: false

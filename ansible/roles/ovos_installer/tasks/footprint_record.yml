---
# The first install only: which of the paths it may create were not there yet, and
# which packages the package manager already considered unneeded. A later run sees
# what the first one created, so an existing record is never rewritten, and an
# install from before this record existed gets none - its uninstall then removes
# none of these, rather than guessing.
- name: Check for an existing footprint record
  ansible.builtin.stat:
    path: "{{ ovos_installer_footprint_marker_path }}"
  register: ovos_installer_footprint_marker_stat
  changed_when: false

- name: Record the machine as the first install finds it
  when: not (ovos_installer_footprint_marker_stat.stat.exists | default(false) | bool)
  block:
    - name: Check which footprint paths are already there
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
      loop: >-
        {{ ovos_installer_footprint_paths
           + ovos_installer_footprint_parent_dirs
           + ovos_installer_footprint_files_if_empty }}
      register: ovos_installer_footprint_stats

    - name: List the packages apt already considers unneeded
      ansible.builtin.command:
        argv: [apt-get, --simulate, autoremove]
      register: ovos_installer_footprint_apt_orphans
      changed_when: false
      when: ansible_facts.os_family == 'Debian'

    - name: List the formulae Homebrew already considers unneeded
      become: true
      become_user: "{{ ovos_installer_user }}"
      ansible.builtin.command:
        argv: [brew, autoremove, --dry-run]
      environment:
        PATH: "{{ ovos_installer_homebrew_path | default('/opt/homebrew/bin:/usr/local/bin') }}:/usr/bin:/bin:/usr/sbin:/sbin"
      register: ovos_installer_footprint_brew_orphans
      changed_when: false
      failed_when: false
      when: ansible_facts.system == 'Darwin'

    # Created as the user: a directory root creates in the user's home is one the
    # user can no longer write to.
    - name: Ensure the footprint record directory exists
      become: true
      become_user: "{{ ovos_installer_user }}"
      ansible.builtin.file:
        path: "{{ ovos_installer_footprint_marker_path | dirname | dirname }}"
        state: directory
        mode: "0755"

    - name: Ensure the footprint record subdirectory exists
      ansible.builtin.file:
        path: "{{ ovos_installer_footprint_marker_path | dirname }}"
        state: directory
        owner: "{{ ovos_installer_footprint_owner }}"
        group: "{{ omit if ovos_installer_footprint_owner != 'root' else ('wheel' if ansible_facts.system == 'Darwin' else 'root') }}"
        mode: "0755"

    - name: Write the footprint record
      vars:
        _absent: >-
          {{ ovos_installer_footprint_stats.results
             | rejectattr('stat.exists') | map(attribute='item') | list }}
        _orphans: >-
          {{
            (ovos_installer_footprint_apt_orphans.stdout_lines
             | select('match', '^Remv ') | map('split', ' ') | map(attribute=1) | list)
            if ovos_installer_footprint_apt_orphans.stdout_lines is defined
            else (
              (ovos_installer_footprint_brew_orphans.stdout_lines
               | reject('match', '^==>') | map('trim') | select | list)
              if (ovos_installer_footprint_brew_orphans.rc | default(1)) == 0
              else none
            )
          }}
      ansible.builtin.copy:
        dest: "{{ ovos_installer_footprint_marker_path }}"
        content: "{{ {'absent': _absent, 'orphans': _orphans} | to_nice_json }}\n"
        owner: "{{ ovos_installer_footprint_owner }}"
        group: "{{ omit if ovos_installer_footprint_owner != 'root' else ('wheel' if ansible_facts.system == 'Darwin' else 'root') }}"
        mode: "0644"

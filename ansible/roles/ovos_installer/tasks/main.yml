---
- name: Include assert.yml
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Include ovos_facts role
  ansible.builtin.import_role:
    name: ovos_facts
  tags:
    - ovos_facts
    - always

- name: Map installer facts for shared roles
  ansible.builtin.set_fact:
    ovos_installer_boot_directory: "{{ ovos_facts_boot_directory }}"
    ovos_installer_networkmanager_dir: "{{ ovos_facts_networkmanager_dir }}"
    ovos_installer_networkmanager_available: "{{ ovos_facts_networkmanager_available }}"
    ovos_installer_systemd_dropin_path: "{{ ovos_facts_systemd_dropin_path }}"
    ovos_installer_systemd_dropin_owner: "{{ ovos_facts_systemd_dropin_owner }}"
    ovos_installer_systemd_dropin_group: "{{ ovos_facts_systemd_dropin_group }}"
    ovos_installer_systemd_dropin_user_path: "{{ ovos_facts_systemd_dropin_user_path }}"
    ovos_installer_systemd_reload_handler: "{{ ovos_facts_systemd_reload_handler }}"
  when:
    - ovos_facts_boot_directory is defined
    - ovos_facts_networkmanager_dir is defined
    - ovos_facts_systemd_dropin_path is defined
  tags:
    - always

# Before any role can create something in the user's home or install a package: the
# uninstall gives back what this finds, and nothing else.
- name: Record the machine as the first install finds it
  ansible.builtin.import_tasks: footprint_record.yml
  when: not (ovos_installer_is_cleaning | bool)
  tags:
    - always

- name: Include ovos_services role for uninstall pre-stop
  ansible.builtin.include_role:
    name: ovos_services
    handlers_from: noop
  when: ovos_installer_is_cleaning | bool
  tags:
    - ovos_services
    - uninstall

- name: Include tuning.yml
  ansible.builtin.import_tasks: tuning.yml
  when:
    - ansible_facts.system == 'Linux'
    - >-
      (ovos_installer_raspberrypi | default('N/A') != "N/A" and ovos_installer_tuning | bool) or
      (ovos_installer_raspberrypi | default('N/A') != "N/A" and ovos_installer_is_cleaning | bool)

# The audio tuning writes PipeWire filter-chains into the user's own config
# (~/.config/pipewire/pipewire.conf.d), and those show up as devices: "OVOS Noise
# Suppressed Source" and "OVOS Noise Suppressed Sink". Its cleanup sits inside
# tuning.yml above, behind the same Raspberry Pi condition as the install, so a
# machine that has those files but is not a Pi can never be cleaned by the
# uninstaller - the user is left deleting PipeWire drop-ins by hand to get their
# sound back. Removing files that were never written is a no-op, so run the
# cleanup wherever an uninstall runs. Only this role: the other tuning roles edit
# the Pi boot config and Pi kernel modules.
- name: Include ovos_audio_tuning role to clean non-Raspberry Pi hosts
  ansible.builtin.import_role:
    name: ovos_audio_tuning
  when:
    - ansible_facts.system == 'Linux'
    - ovos_installer_is_cleaning | bool
    - ovos_installer_raspberrypi | default('N/A') == "N/A"
  tags:
    - tuning
    - ovos_audio_tuning
    - uninstall

- name: Include ovos_sound role
  ansible.builtin.import_role:
    name: ovos_sound
  when:
    - ansible_facts.system == 'Linux'
    - ovos_installer_profile != "server"
  tags:
    - ovos_sound

- name: Include ovos_timezone role
  ansible.builtin.import_role:
    name: ovos_timezone
  tags:
    - ovos_timezone

- name: Include ovos_config role
  ansible.builtin.import_role:
    name: ovos_config
  tags:
    - ovos_config

- name: Include ovos_containers role
  ansible.builtin.import_role:
    name: ovos_containers
  when:
    - ansible_facts.system == 'Linux'
    - ovos_installer_method == "containers"
  tags:
    - ovos_containers

- name: Include ovos_virtualenv role
  ansible.builtin.import_role:
    name: ovos_virtualenv
  when: ovos_installer_method == "virtualenv" or ovos_installer_is_cleaning | bool
  tags:
    - ovos_virtualenv

- name: Include ovos_services role
  ansible.builtin.import_role:
    name: ovos_services
  when: not (ovos_installer_is_cleaning | bool)
  tags:
    - ovos_services

- name: Include ovos_finalize role
  ansible.builtin.import_role:
    name: ovos_finalize
  tags:
    - ovos_finalize

- name: Include ovos_telemetry role
  ansible.builtin.import_role:
    name: ovos_telemetry
  when: ovos_installer_telemetry | default(false) | bool
  tags:
    - ovos_telemetry

# Every uninstall runs with --tags uninstall, and a dynamic include does not hand
# its tags to the tasks it includes: without apply, none of uninstall.yml ran -
# not the directory removal, not the package autoremove.
- name: Include uninstall tasks
  ansible.builtin.include_tasks:
    file: uninstall.yml
    apply:
      tags:
        - uninstall
  when: ovos_installer_is_cleaning | bool
  tags:
    - uninstall

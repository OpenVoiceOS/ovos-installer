---
ovos_installer_boot_firmware_path: /boot/firmware
ovos_installer_boot_default_path: /boot
ovos_installer_networkmanager_path: /etc/NetworkManager
ovos_installer_i2c_devices: []
ovos_installer_systemd_system_path: /etc/systemd/system
ovos_installer_systemd_user_path: "{{ ovos_installer_user_home }}/.config/systemd/user"
ovos_installer_package_tracking_dir: "{{ ovos_installer_user_home }}/.cache/ovos-installer/package-tracking"
# Owner of the records the uninstall trusts: root, so the user cannot rewrite them.
ovos_installer_footprint_owner: root
# What the first install finds on the machine, so the uninstall can give back what it
# found and nothing else (tasks/footprint_record.yml, tasks/footprint_restore.yml).
ovos_installer_footprint_marker_path: "{{ ovos_installer_package_tracking_dir }}/footprint.json"
# The highest directory setup.sh created for its own state in this run, if any
# (state_directory in utils/common.sh). setup.sh runs first, so without this the
# record would find ~/.local and take it for the user's.
ovos_installer_state_created_from: ""
# Which package manager the footprint record and the uninstall's autoremove ask:
# Ansible's os_family (Debian, Zorin OS, RedHat, Suse, Archlinux, Darwin).
ovos_installer_package_family: "{{ ansible_facts.os_family | default('') }}"
# Created as side effects of installing: the installer's own uv and the Python uv
# manages for the virtualenv, the models OVOS downloads, onnxruntime's device id and
# database, and the state of the sound stack the sound role installs. Removed when
# they were not there before.
ovos_installer_footprint_paths:
  - "{{ ovos_installer_user_home }}/.local/bin/uv"
  - "{{ ovos_installer_user_home }}/.local/bin/python{{ ovos_installer_venv_python }}"
  - "{{ ovos_installer_user_home }}/.cache/Microsoft/DeveloperTools/.onnxruntime"
  # WirePlumber's own state: what a user configures goes in ~/.config/wireplumber.
  - "{{ ovos_installer_user_home }}/.local/state/wireplumber"
# Created by the install too, but places the user can keep their own things in later:
# models they download and their Hugging Face token, uv tools and other Pythons,
# their own PulseAudio client.conf. Only what the install put there goes, and the
# directory itself only once nothing is left in it but the tool's own bookkeeping.
# Patterns match paths inside the directory; a directory that matches goes whole.
# A store holds content for whatever links to it: huggingface_hub 2 keeps the files of
# every model in hub/blobs, and a model's own blobs are links into it. A file there
# is the install's when only the install's models link to it, the user's as soon as
# one of theirs does. The install's parts of a directory that was there before go
# too, when they are names only OVOS uses.
ovos_installer_footprint_shared_dirs:
  - path: "{{ ovos_installer_user_home }}/.cache/huggingface"
    owned: >-
      {{ ovos_installer_footprint_hf_models | map('regex_replace', '^', 'hub/') | list
         + ovos_installer_footprint_hf_models | map('regex_replace', '^', 'hub/.locks/') | list }}
    # A repository's refs and its record of files that do not exist hold no model:
    # huggingface_hub writes them even for a download into a directory of its own,
    # which is how the local recognizer fetches its model.
    bookkeeping: [".*", "xet", "hub/.locks", "hub/CACHEDIR.TAG", "hub/version.txt", "hub/*--*/refs", "hub/*--*/.no_exist"]
    store: hub/blobs
    owned_even_if_there_before: true
  - path: "{{ ovos_installer_user_home }}/.local/share/uv"
    owned: ["python/cpython-{{ ovos_installer_venv_python }}[-.]*"]
    bookkeeping: [".lock", ".gitignore", "python/.lock", "python/.gitignore", "python/.temp", "python/.cache"]
  - path: "{{ ovos_installer_user_home }}/.config/pulse"
    owned: ["cookie", "*-runtime", "*.tdb", "*-default-sink", "*-default-source"]
    bookkeeping: []
# Created on the way to the paths above. Removed when they were not there before and
# nothing else is left in them, deepest first.
ovos_installer_footprint_parent_dirs:
  - "{{ ovos_installer_user_home }}/.local/bin"
  - "{{ ovos_installer_user_home }}/.local/share"
  - "{{ ovos_installer_user_home }}/.local/state"
  - "{{ ovos_installer_user_home }}/.local"
  - "{{ ovos_installer_user_home }}/.config/systemd/user"
  - "{{ ovos_installer_user_home }}/.config/systemd"
  - "{{ ovos_installer_user_home }}/.config"
  - "{{ ovos_installer_user_home }}/.cache/Microsoft/DeveloperTools"
  - "{{ ovos_installer_user_home }}/.cache/Microsoft"
  - "{{ ovos_installer_user_home }}/.cache"
# Removed when they were not there before and hold nothing but whitespace once the
# uninstall has taken its own lines out: the macOS wrapper is sourced from ~/.zshrc.
ovos_installer_footprint_files_if_empty:
  - "{{ ovos_installer_user_home }}/.zshrc"
# The models OVOS downloads into a Hugging Face cache that may well be the user's own:
# these go even when the cache itself was there before, with what only they link to in
# the cache's store.
ovos_installer_footprint_hf_models:
  - "models--OpenVoiceOS--*"
  - "models--Jarbas--*"
  - "models--TigreGotico--*"
# systemd owns this layout and does not make it configurable, so there is one
# definition of it and every role resolves it from here. Two knobs for one path is
# how the claim ends up inspecting a different file from the one that was touched.
ovos_installer_linger_path: "/var/lib/systemd/linger/{{ ovos_installer_user }}"
# Root-only, outside the user's home: this records a machine-wide setting, it must
# not be forgeable by the account it is about, and ~/.cache/ovos-installer is wiped
# by the uninstall's own remove-directories step.
ovos_installer_linger_state_dir: /var/lib/ovos-installer
# Per user, like lingering itself. A single marker would let an install for one
# account answer for another: the second install declines the claim because the
# marker exists, and its uninstall then disables lingering it never enabled and
# deletes the first account's marker on the way out.
ovos_installer_linger_marker_path: "{{ ovos_installer_linger_state_dir }}/linger/{{ ovos_installer_user }}.json"
ovos_installer_linger_disable_cmd: "loginctl disable-linger {{ ovos_installer_user }}"
ovos_installer_pip_config_file: ""
ovos_installer_tmp_dir: "{{ _ovos_installer_working_directory }}"
ovos_installer_profile: "ovos"
ovos_installer_method: "virtualenv"
ovos_installer_cleaning: false
ovos_installer_is_cleaning: "{{ ovos_installer_cleaning | default(false) | bool }}"
ovos_installer_desktop_profiles:
  - ovos
  - listener
ovos_installer_is_desktop_profile: "{{ (ovos_installer_profile | default('ovos')) in ovos_installer_desktop_profiles }}"
ovos_installer_channel: "testing"
ovos_installer_requirements_files:
  - file: virtualenv/core-requirements.txt
    dest: "{{ ovos_installer_tmp_dir }}/core-requirements.txt"
    state: "{{ ovos_installer_is_desktop_profile | bool }}"
  - file: virtualenv/skills-requirements.txt
    dest: "{{ ovos_installer_tmp_dir }}/skills-requirements.txt"
    state: "{{ ovos_installer_feature_skills | bool and ovos_installer_profile != 'satellite' }}"
  - file: virtualenv/extra-skills-requirements.txt
    dest: "{{ ovos_installer_tmp_dir }}/extra-skills-requirements.txt"
    state: "{{ ovos_installer_feature_extra_skills | bool and ovos_installer_profile != 'satellite' }}"
  - file: virtualenv/homeassistant-requirements.txt
    dest: "{{ ovos_installer_tmp_dir }}/homeassistant-requirements.txt"
    state: >-
      {{ ovos_installer_feature_homeassistant | bool
         and ovos_installer_method == 'virtualenv'
         and ovos_installer_is_desktop_profile | bool
         and ((ovos_installer_homeassistant_url
               | default(ovos_installer_homeassistant_host | default(''), true)) | length > 0)
         and (ovos_installer_homeassistant_api_key | default('') | length > 0) }}
  - file: virtualenv/listener-requirements.txt
    dest: "{{ ovos_installer_tmp_dir }}/listener-requirements.txt"
    state: "{{ ovos_installer_profile == 'listener' }}"
  - file: virtualenv/satellite-requirements.txt
    dest: "{{ ovos_installer_tmp_dir }}/satellite-requirements.txt"
    state: "{{ ovos_installer_profile == 'satellite' }}"
  - file: virtualenv/server-requirements.txt
    dest: "{{ ovos_installer_tmp_dir }}/server-requirements.txt"
    state: "{{ ovos_installer_profile == 'server' }}"
ovos_installer_docker_repo_base_url: "https://download.docker.com/linux"
ovos_installer_docker_repo_path: /etc/yum.repos.d/docker-ce.repo
ovos_installer_docker_repo_apt_filename: /etc/apt/sources.list.d/docker
ovos_installer_docker_packages_redhat:
  - docker-ce
  - docker-ce-cli
  - docker-ce-rootless-extras
ovos_installer_docker_packages_debian:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
ovos_installer_xhost_package_fedora: xhost
ovos_installer_xhost_package_default: xorg-x11-server-utils
ovos_installer_x11_xserver_utils_package: x11-xserver-utils
ovos_installer_ovos_docker_repo_url: https://github.com/OpenVoiceOS/ovos-docker.git
# Pinned to an ovos-docker release so containers-mode installs are reproducible; bump on new releases.
ovos_installer_ovos_docker_repo_branch: v2.2.0
ovos_installer_hivemind_docker_repo_url: https://github.com/JarbasHiveMind/hivemind-docker.git
# v2.0.0 predates hivemind-docker#45, without which a satellite has no mount for
# ~/.config/hivemind: an identity written by "hivemind-client set-identity" in the
# hivemind_cli container - which composer.yml does - never reaches the satellite.
# Pinned to a hivemind-docker release so satellite installs are reproducible, the
# same way ovos-docker is above; bump on new releases.
ovos_installer_hivemind_docker_repo_branch: v2.1.2
ovos_installer_docker_image_tag: "{{ ovos_installer_channel | default('testing') }}"
ovos_installer_docker_pull_policy: always
ovos_installer_docker_compose_remove_orphans: true
ovos_installer_docker_compose_remove_images: all
ovos_installer_docker_compose_remove_volumes: true
ovos_installer_uninstall: "{{ 'present' if not (ovos_installer_is_cleaning | bool) else 'absent' }}"
ovos_installer_uninstall_autoremove: true
ovos_installer_uninstall_remove_packages: "{{ ovos_installer_is_cleaning | bool }}"
# Keep this quoted (e.g., "3.11"). Unquoted YAML like 3.10 may parse as 3.1.
ovos_installer_venv_python: "3.11"
ovos_installer_supported_desktop_architectures:
  - x86_64
  - aarch64
  - arm64
# ggwave still depends on the plugin-manager 1.x stack, while the current
# OVOS testing stack resolves to plugin-manager 2.x. Keep it opt-in until
# ovos-audio-transformer-plugin-ggwave is compatible with plugin-manager 2.x.
ovos_installer_enable_ggwave: false
# The alpha channel pins pre-releases almost everywhere (170 of 176 pins at the
# time of writing; testing and stable pin none), and uv does not enable
# pre-releases just because a constraints file asks for one - only this flag
# does. Without it an alpha install cannot resolve at all on the default
# Python 3.11: uv reports "No solution found" and hints at --prerelease=allow.
ovos_installer_uv_allow_prerelease: >-
  {{
    (ovos_installer_channel | default('testing')) == 'alpha'
    or (
      (ovos_installer_venv_python_major | int) == 3
      and (ovos_installer_venv_python_minor | int) >= 13
    )
  }}
ovos_installer_tuning: false
ovos_installer_setuptools_package: "setuptools<82"
ovos_installer_tuning_performance: >-
  {{ ovos_installer_tuning | bool and (ovos_installer_raspberrypi | default('N/A')) != 'N/A' }}
ovos_installer_tuning_audio_low_latency: "{{ ovos_installer_tuning_performance | bool }}"
ovos_installer_tuning_audio_noise_suppression: "{{ ovos_installer_tuning | bool }}"
ovos_installer_tuning_audio_ns_level: 1
ovos_installer_tuning_audio_ns_agc: true
ovos_installer_tuning_audio_bluetooth_profile: "headset-head-unit"
ovos_installer_tuning_audio_bluetooth_profile_fallback: "handsfree_head_unit"
ovos_installer_tuning_audio_capture_target: ""
ovos_installer_tuning_audio_playback_target: ""
ovos_installer_audio_card_index: ""
ovos_installer_tuning_overclock: false
ovos_installer_tuning_numa: "{{ ovos_installer_tuning_performance | bool }}"
ovos_installer_systemd_scope: "{{ 'system' if ovos_installer_tuning_performance | bool else 'user' }}"
ovos_installer_tuning_mycroft_state_tmpfs: true
ovos_installer_tuning_mycroft_state_tmpfs_size: "100M"
ovos_installer_tuning_tmpfs_size: "512M"
ovos_installer_tuning_mycroft_state_sync_interval: "5m"
ovos_installer_tuning_mycroft_state_dir: "{{ ovos_installer_user_home }}/.local/state/mycroft"
ovos_installer_tuning_mycroft_state_persist_dir: "{{ ovos_installer_user_home }}/.local/state/mycroft-persistent"
ovos_installer_overclock_arm_boost: "1"
ovos_installer_overclock_initial_turbo: "60"
ovos_installer_overclock_over_voltage: "6"
ovos_installer_overclock_arm_freq: "{{ '2800' if 'Raspberry Pi 5' in (ovos_installer_raspberrypi | default('')) else '2000' }}"
ovos_installer_overclock_gpu_freq: "750"
ovos_installer_uv_version: ""
# The uv setup.sh checked against the version floor, by absolute path.
ovos_installer_uv_bin: ""
ovos_installer_venv_python_parts: "{{ ovos_installer_venv_python | string | regex_findall('[0-9]+') }}"
ovos_installer_venv_python_major: "{{ (ovos_installer_venv_python_parts | first | default('0')) | int }}"
ovos_installer_venv_python_minor: "{{ (ovos_installer_venv_python_parts[1:] | first | default('0')) | int }}"
ovos_installer_hotword_sensitivity: 0.95
ovos_installer_hotword_trigger_level: 1
ovos_installer_mark2_hotword_sensitivity: 0.55
ovos_installer_mark2_hotword_trigger_level: 3
ovos_installer_mark2_vad_pre_wake_enabled: false
ovos_installer_listener_multiplier: 1.5
ovos_installer_tuning_source_volume: 1.0
ovos_installer_cpu_is_capable: false
# Where STT and TTS run: "public" (the Open Voice OS servers, the default) or
# "local" (on this host, see ovos_config/tasks/speech.yml). setup.sh only passes
# local for alpha installs on hardware that can run it.
ovos_installer_speech_engine: public
ovos_installer_local_speech_capable: false
ovos_installer_locale: "en-us"
ovos_installer_feature_skills: true
ovos_installer_feature_extra_skills: false
ovos_installer_feature_homeassistant: false
ovos_installer_feature_gui: false
ovos_installer_feature_llm: false
# Home Assistant skill directory name under `~/.config/mycroft/skills/`.
ovos_installer_homeassistant_skill_id: "skill-homeassistant.oscillatelabsllc"
ovos_installer_homeassistant_url: ""
# Backward compatible alias; prefer ovos_installer_homeassistant_url.
ovos_installer_homeassistant_host: ""
ovos_installer_homeassistant_api_key: ""
ovos_installer_llm_api_url: ""
ovos_installer_llm_api_key: ""
ovos_installer_llm_model: ""
ovos_installer_llm_persona: "Respond in the same language as the user in a plain spoken style for a voice assistant. No emojis. No markdown. No bullet points. No parenthetical asides. Keep replies concise, usually one or two short sentences. Start directly with the answer and sound natural when spoken aloud."
ovos_installer_llm_max_tokens: 300
ovos_installer_llm_temperature: 0.2
ovos_installer_llm_top_p: 0.1
ovos_installer_llm_persona_name: "OVOS Installer LLM"
ovos_installer_usage_telemetry: false
ovos_installer_telemetry: "{{ ovos_installer_usage_telemetry | bool }}"
ovos_installer_run_ovos_config: false
ovos_installer_ovos_config_autoconfigure_enabled: >-
  {{
    (ovos_installer_profile | default('ovos')) != 'server'
    and (
      (ovos_installer_method | default('virtualenv')) == 'containers'
      or (
        (ovos_installer_method | default('virtualenv')) == 'virtualenv'
        and (
          ovos_virtualenv_run_ovos_config
          | default(ovos_installer_run_ovos_config | default(false))
          | bool
        )
      )
    )
  }}
ovos_installer_ovos_config_tts_gender: >-
  {{
    '--female'
    if (ovos_installer_locale | default('') | lower) in ['eu-es', 'gl-es']
    else '--male'
  }}
ovos_installer_geoip_enabled: false
ovos_installer_geoip_url: "https://ipapi.co/json/"
ovos_installer_mark2_network_tests_ip_url: "https://ifconfig.me/ip"
ovos_installer_system_unit: "metric"
ovos_installer_temperature_unit: "celsius"
ovos_installer_precipitation_unit: "mm"
ovos_installer_windspeed_unit: "kph"
ovos_installer_time_format: "full"
ovos_installer_spoken_time_format: "full"
ovos_installer_date_format: "DMY"
ovos_installer_core_services:
  - ovos-core
  - ovos-audio
  - ovos-listener
  - ovos-messagebus
  - ovos-phal
ovos_installer_rt_services:
  - ovos-audio
  - ovos-listener
  - ovos-core

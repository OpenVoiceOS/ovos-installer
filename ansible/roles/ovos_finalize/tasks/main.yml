---
- name: Include assert.yml
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Configuration drift detection
  vars:
    _drift: "{{ 'true' if (ovos_config_configuration.changed | default(false)) | bool else 'false' }}"
  ansible.builtin.debug:
    msg: The "mycroft.conf" configuration file has been restored, existing file has been backup.
  when: _drift | bool

# The command nobody guesses: the package is ovos-tui-client, the command is ovos-tui.
# It answers the question people have right after an install - is OVOS alive, or is my
# audio broken - without a microphone, and it names the skill that replied. Printed from
# the play as well as the finish screen because a scenario install never sees that
# screen.
#
# Only where it exists: the virtualenv method installs it with the core and server
# requirements (so every profile but a satellite), and the containers method has it in
# the ovos_cli container, which only the desktop compositions define.
- name: Say how to talk to OVOS from a terminal
  vars:
    _ovos_text_client_command: >-
      {{ 'docker exec -it ' ~ (ovos_containers_container_ovos_cli | default('ovos_cli')) ~ ' ovos-tui'
         if ovos_installer_method == 'containers' else 'ovos-tui' }}
  ansible.builtin.debug:
    msg:
      - "To talk to it without a microphone, and to see which skill answered:"
      - ""
      - "  {{ _ovos_text_client_command }}"
  when:
    - ovos_installer_profile != 'satellite'
    - ovos_installer_method != 'containers' or (ovos_installer_is_desktop_profile | default(false) | bool)

# A satellite cannot grant itself the right to be heard. hivemind-core refuses a client
# every message type until one is allowed explicitly, and recognizer_loop:utterance is no
# longer granted by default - so a satellite connects, authenticates, and then has
# everything it says rejected, which looks like a broken satellite rather than a missing
# permission. The grant is per client and lives in the listener's database, so it can only
# be made there; this machine has neither that database nor the hivemind-core command.
#
# Printed from the play rather than the finish screen because a scenario install never
# reaches the finish screen, and a scenario install is exactly how a fleet of satellites
# gets built.
- name: Explain what the HiveMind listener still has to allow
  ansible.builtin.debug:
    msg:
      - "This satellite has to be allowed to speak, on the machine running the"
      - "HiveMind listener at {{ ovos_installer_listener_host }}:{{ ovos_installer_listener_port | default(5678, true) }}:"
      - ""
      - "  hivemind-core list-clients"
      - "  hivemind-core allow-msg recognizer_loop:utterance <node-id>"
      - ""
      - >-
        Use list-clients to find the Node ID whose access key begins
        {{ (ovos_installer_satellite_key | default(''))[:8] }} - that is this
        satellite. Until the grant is made it will connect and authenticate, and
        everything it says will be refused.
  when: ovos_installer_profile == 'satellite'
